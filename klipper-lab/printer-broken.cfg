# printer.cfg — the lab printer.
#
# This machine does not exist. It is an invented,
# generic Cartesian printer: a 220 x 220 mm bed,
# a single Z leadscrew, one direct-drive extruder.
# Its numbers are typical of a small Cartesian kit
# and were chosen so the file can be read, checked
# and run against Klipper's simulated microcontroller
# (the "Linux process" build). Pin names are the
# simulator's gpio names; on a real board they would
# be that board's pin names, and every value here
# would have to be re-measured for the real machine.
#
# Nothing in this file is safe to copy onto a real
# printer you have not checked it against. Firmware
# commands real motion and real heat.

[stepper_x]
step_pin: gpio999
dir_pin: gpio3
enable_pin: !gpio4
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio5
position_endstop: 0
position_min: 0
position_max: 220
homing_speed: 50

[stepper_y]
step_pin: gpio6
dir_pin: gpio7
enable_pin: !gpio8
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio9
position_endstop: 0
position_min: 0
position_max: 220
homing_speed: 50

[stepper_z]
step_pin: gpio10
dir_pin: gpio11
enable_pin: !gpio12
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio13
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 8
homing_retract_dist: 5

[extruder]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 33
gear_ratio: 3:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio17
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
pressure_advance: 0.040
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: gpio18
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 110

[fan]
pin: gpio19

[respond]
# Enables the RESPOND command the macros below use to
# talk back. Without this section, RESPOND is an
# unknown command — the lab's first batch run said so.

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 42.0
shaper_type_y: mzv
shaper_freq_y: 38.0

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

# ----------------------------------------------------------------
# Macros (chapter 11). START_PRINT is deliberately a dry skeleton:
# it homes and parks, and announces itself. A production profile
# adds the heat-up lines (M104/M109, M140/M190) and a priming
# move; those lines wait for real temperatures, so a simulator
# run would wait forever. The chapter shows them and says why
# they are commented out here.
# ----------------------------------------------------------------

[gcode_macro START_PRINT]
description: Home, park, and announce ready
gcode:
    G28
    G1 Z5 F600
    G1 X5 Y5 F3000
    M400
    RESPOND MSG="Printer ready"

[gcode_macro PARK_TOOLHEAD]
description: Raise Z a little and park at the back left
gcode:
    G91
    G1 Z5 F600
    G90
    G1 X5 Y215 F3000
