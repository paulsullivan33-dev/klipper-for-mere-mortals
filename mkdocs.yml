site_name: Klipper for Mere Mortals
site_description: Firmware that plans a 3D printer's moves on a real computer and leaves only timing to the printer board. The three pieces, the printer.cfg file section by section, first checks, homing, probes, input shaping and pressure advance, with the safety rules and the limits stated plainly.
